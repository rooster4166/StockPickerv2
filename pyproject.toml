[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microcap-engine"
version = "0.1.0"
description = "A run-once, buy-and-hold LLM research desk for under-covered $50-300M stocks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Justin Williams", email = "justindaviswilliams@gmail.com" }]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavier data deps — parquet cache, HTML parsing. Kept optional so the core
# engine + tests run without them.
data = [
    "polars>=0.20",
    "pyarrow>=15",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
microcap = "microcap_engine.runner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (Anthropic / FMP / EDGAR); skipped by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum is an intentional, JSON-serialization-friendly pattern (not StrEnum).
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
