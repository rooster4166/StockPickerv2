[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microcap-value-engine"
version = "0.1.0"
description = "A run-once, buy-and-hold LLM research desk for under-covered $50-300M stocks"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
microcap = "microcap_engine.cli:main"

[tool.setuptools.packages.find]
include = ["microcap_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
